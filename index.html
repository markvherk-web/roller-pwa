<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Birmingham Roller Flight</title>
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#8cc8f0">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.png">
<style>
:root{--hb:rgba(255,255,255,.8);--hf:#10283d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--hb:rgba(12,24,40,.74);--hf:#eaf4ff}}
:root[data-theme="dark"]{--hb:rgba(12,24,40,.74);--hf:#eaf4ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#8cc8f0;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top,0px));max-width:min(330px,calc(100% - 20px));padding:8px 11px;border-radius:12px;background:var(--hb);color:var(--hf);font:13px/1.4 system-ui,sans-serif;z-index:10;pointer-events:none;backdrop-filter:blur(4px)}
.pool-wrap{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.pool-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--hf)}
#entry{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:min(320px,calc(100% - 28px));padding:14px;border-radius:14px;background:var(--hb);color:var(--hf);font:600 15px Georgia,serif;text-align:center;z-index:20}
#entry[hidden]{display:none}
#entry input{flex:1 1 150px;min-width:0;font:16px system-ui,sans-serif;padding:8px 10px;border:1.5px solid var(--hf);border-radius:8px;background:transparent;color:var(--hf)}
#entry button{font:600 15px system-ui,sans-serif;padding:8px 16px;border:0;border-radius:8px;background:#2f6f4f;color:#fff}
#entry :focus-visible{outline:3px solid #f2b705;outline-offset:2px}
#recbtn{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:15;min-height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--hb);color:var(--hf);font:600 13px system-ui,sans-serif;backdrop-filter:blur(4px)}
#rec{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top,0px)) 14px max(14px,env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.55)}
#rec[hidden]{display:none}
#rec .card{display:flex;flex-direction:column;width:min(520px,100%);max-height:100%;border-radius:14px;background:var(--hb);color:var(--hf);backdrop-filter:blur(6px)}
.rh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;font:700 16px Georgia,serif}
.rh button{min-height:40px;padding:0 14px;border:0;border-radius:8px;background:#2f6f4f;color:#fff;font:600 14px system-ui,sans-serif}
#rl{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 14px 12px}
.rr{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(128,128,128,.28);font:14px/1.3 system-ui,sans-serif}
.rr.none{opacity:.55}.rr.cur{font-weight:700}
.sw{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:50%;border:1px solid var(--hf)}
#recbtn:focus-visible,.rh button:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
#sndbtn{position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:15;min-height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--hb);color:var(--hf);font:600 13px system-ui,sans-serif;backdrop-filter:blur(4px)}
#sndbtn:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
#micbtn{position:absolute;right:10px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;min-height:44px;padding:0 14px;border:0;border-radius:12px;overflow:hidden;background:var(--hb);color:var(--hf);font:600 13px system-ui,sans-serif;backdrop-filter:blur(4px)}
#micbtn::after{content:'';position:absolute;left:0;bottom:0;height:4px;width:var(--lv,0%);background:#2f9e6a}
#micbtn:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
#callbtn{position:absolute;right:10px;bottom:calc(118px + env(safe-area-inset-bottom,0px));z-index:15;min-height:44px;padding:0 14px;border:0;border-radius:12px;overflow:hidden;background:var(--hb);color:var(--hf);font:600 13px system-ui,sans-serif;backdrop-filter:blur(4px);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#callbtn[hidden]{display:none}
#callbtn::after{content:'';position:absolute;left:0;bottom:0;height:4px;width:var(--lv,0%);background:#2f9e6a}
#callbtn:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
#hud{background:linear-gradient(160deg,#0f3d2b,#092619);color:#f6ecd0;border:2px solid #d4af37;border-radius:14px;padding:9px 12px;box-shadow:0 6px 18px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.08);font:13px/1.45 system-ui,sans-serif;font-variant-numeric:tabular-nums;backdrop-filter:none}
#hud .sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px;font:italic 700 15px Georgia,serif;color:#ffd35a}
#hud .k{font:12px system-ui,sans-serif;color:#cfe5d6}
#hud .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.1)}
#hud .g{color:#ffd35a;font-size:15px}
#hud .bet{display:flex;align-items:center;gap:8px;font:700 16px Georgia,serif}
#hud button{pointer-events:auto;width:40px;height:40px;padding:0;border-radius:50%;border:3px dashed #fff;background:#b3261e;color:#fff;font:700 20px/1 Georgia,serif;cursor:pointer}
#hud button:disabled{opacity:.35;cursor:default}
#hud button:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
#hud .pots{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0}
#hud .pots i{font:normal 11px system-ui,sans-serif;padding:1px 7px;border:1px solid rgba(212,175,55,.55);border-radius:10px;background:rgba(255,255,255,.08)}
#hud .rules{margin-top:6px;font-size:11.5px;line-height:1.4;color:#cfe5d6}
</style></head>
<body><canvas id="game"></canvas><div id="hud"></div>
<div id="entry" hidden><div id="es" style="flex-basis:100%"></div><input id="nm" maxlength="12" placeholder="Your name" autocomplete="off" aria-label="Your name"><button id="sv">Save score</button></div>
<button id="recbtn" type="button" aria-haspopup="dialog">Pool and bests</button>
<button id="sndbtn" type="button" aria-pressed="true">Sound on</button>
<button id="micbtn" type="button" aria-pressed="false">Voice call off</button>
<button id="callbtn" type="button">Hold to call</button>
<div id="rec" hidden role="dialog" aria-modal="true" aria-label="Pigeon pool and level bests"><div class="card"><div class="rh"><span>Pigeon pool and level bests</span><button id="rx" type="button">Close</button></div><div id="rl"></div></div></div>
<script>
const TOTAL_POOL=15,BASE_FLOCK=6,MAX_LEVEL=30,TAU=Math.PI*2;
// Roller plumage patterns: b body, h head/neck, w wing, f flights, t tail, k beak, sh neck sheen
const PATS=[
{n:'Blue Bar',b:'#8d9fb5',h:'#566a85',w:'#a3b3c7',f:'#66768c',t:'#6f8199',k:'#2a2a2e',sh:.9,bar:1},
{n:'Black',b:'#25282e',h:'#1a1c21',w:'#30343b',f:'#1d2025',t:'#1d2025',k:'#18181a',sh:1},
{n:'Red',b:'#b4472a',h:'#9a3a20',w:'#c2552f',f:'#a03c22',t:'#a03c22',k:'#d9c5aa',sh:.2},
{n:'Yellow',b:'#dbac3b',h:'#c4952c',w:'#e6bd50',f:'#cfa032',t:'#cfa032',k:'#e2d2b4',sh:.1},
{n:'Blue Check',b:'#8498b0',h:'#4f627c',w:'#7d91aa',f:'#59697f',t:'#6a7c94',k:'#2a2a2e',sh:.9,chk:1},
{n:'Grizzle',b:'#b9bbc2',h:'#6d7078',w:'#c6c8ce',f:'#8a8d95',t:'#868992',k:'#3a3a3e',sh:.6,spk:1},
{n:'Badge',b:'#7e3022',h:'#f4f1ea',w:'#8f3b2a',f:'#f4f1ea',t:'#f4f1ea',k:'#e2cfb4',sh:0},
{n:'White',b:'#f2f0ea',h:'#e8e5dc',w:'#ece9e0',f:'#dedbd0',t:'#e3e0d6',k:'#e8cdb8',sh:0}];

let level=1,levelLandings=0,score=0,themeIdx=0,entering=false,lastIdx=-1,banner=150,toast=null,landings=0,pigeons=[],flyingIndices=[],gameOver=false,gameStarted=false;
let squeezing=false,hardSqueeze=false,touchStartY=null,activeTouches=0,W=0,H=0,dpr=1,clouds=[],lastHud='';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),hud=document.getElementById('hud');
const scene=document.createElement('canvas'),loft={w:100,h:60,x:0,y:0};
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
// One scene per level; levels past the last theme cycle back to the first
const THEMES=[
{n:'Birmingham morning',sky:['#3f86d4','#8cc8f0','#e8f4fb'],sun:[.8,.16,'255,247,210'],hill:'#a9c9b3',brick:['#a24f38','#92432f'],roof:'#3d4859',hz:'215,236,250',grass:['#6fa05a','#4e7d43'],fence:'#d9d2c0',cl:'rgba(255,255,255,.8)',win:'rgba(236,246,255,.85)'},
{n:'Golden hour',sky:['#3b3470','#e0685a','#ffd08a'],sun:[.25,.7,'255,196,110'],hill:'#7a5272',brick:['#8a4538','#783a31'],roof:'#2c2a3d',hz:'255,170,120',grass:['#587343','#435b34'],fence:'#d8b898',cl:'rgba(255,196,170,.8)',win:'rgba(255,214,140,.9)'},
{n:'Countryside',kind:1,sky:['#2f7fd0','#7cc4f2','#dff2fb'],sun:[.2,.14,'255,250,220'],hill:'#8fbf86',tree:['#3f7a3a','#5a9a4a','#2f6532'],hz:'215,236,250',grass:['#7fb45f','#5a9444'],fence:'#d9d2c0',cl:'rgba(255,255,255,.85)'},
{n:'Overcast',sky:['#76828f','#a3adb7','#d3d9de'],sun:[.5,.1,'255,255,255'],hill:'#8d9ca0',brick:['#8d5a4c','#7d4e42'],roof:'#474f59',hz:'205,212,220',grass:['#5f7f55','#4a6a43'],fence:'#c7c3b8',cl:'rgba(232,236,240,.9)',win:'rgba(225,232,240,.7)'},
{n:'Starry night',night:1,sky:['#060a1c','#14204a','#2b3d6c'],sun:[.78,.16,'225,236,255'],hill:'#1b2a45',brick:['#4a2b2e','#3e2528'],roof:'#11162a',hz:'40,60,110',grass:['#1f3a2c','#15281e'],fence:'#7e7c78',cl:'rgba(95,110,155,.5)',win:'rgba(255,212,120,.95)'},
{n:'Winter',snow:1,sky:['#9bb2ca','#cddbe8','#f0f5f9'],sun:[.8,.14,'255,255,255'],hill:'#e2ebf2',brick:['#9a5646','#8a4a3b'],roof:'#4b5563',hz:'235,242,248',grass:['#f3f7fa','#dce6ee'],fence:'#c8c0b0',cl:'rgba(255,255,255,.9)',win:'rgba(255,230,170,.9)'},
{n:'Autumn',kind:1,sky:['#4f86c4','#e9b97a','#f8e3b6'],sun:[.75,.2,'255,226,160'],hill:'#c48f50',tree:['#c4552a','#e0a030','#a63d22'],hz:'250,214,160',grass:['#a3864a','#7e6a3a'],fence:'#d8c8a0',cl:'rgba(255,236,206,.8)'},
{n:'Dawn mist',sky:['#5f74b0','#e5a3c0','#fde8cc'],sun:[.5,.72,'255,222,170'],hill:'#9b86a8',brick:['#9a5a55','#874b49'],roof:'#4a4260',hz:'250,205,215',grass:['#7b9a72','#5e7e58'],fence:'#e0cfc4',cl:'rgba(255,225,230,.8)',win:'rgba(255,236,200,.85)'}];

// High scores: top 10 with names, kept in localStorage (try/catch: storage can be unavailable)
const esc=s=>String(s).replace(/[&<>]/g,c=>'&#'+c.charCodeAt(0)+';');
function loadScores(){try{const a=JSON.parse(localStorage.getItem('rollerScores'));return Array.isArray(a)?a.filter(e=>e&&typeof e.s==='number'&&typeof e.n==='string'&&e.s>=HS_MIN*10).slice(0,10):[]}catch(e){return[]}}
const HS_MIN=50; // high scores unlock once level 5 is finished: 5 levels x 10 landings
// Landing points: 10 base + 5 per full roll + up to 50 for height (share of the sky climbed) + 3 per second aloft
function award(p){
  const rolls=Math.floor(p.spin/TAU),hf=Math.min(1.5,p.peak/Math.max(1,loft.y)),sec=p.air/60,pts=Math.round(10+rolls*5+hf*50+sec*3);
  const pot=pigeons.reduce((s,q)=>s+Math.max(q.pot||0,2),0),odds=pts/80,total=Math.round(pot*odds*100)/100; // the house tops empty pots up to $2, so you can always win new money
  const b=best[level],rec=!b||total>b.s;if(rec){best[level]={n:p.name,s:total};saveBest()}snd('land',pts,rec);if(total>stake)snd('coin');
  bank=Math.round((bank+total)*100)/100;score=Math.round((score+total)*100)/100;saveBank();toast={t:200,pts,rolls,h:Math.round(hf*100),sec:sec.toFixed(1),name:p.name,rec,lvl:level,total,pot,odds,stake,bank};
}
let scores=loadScores();
// Every bird has a name; the best single landing on each level is remembered with the bird that flew it
const NAMES=['Dizzy','Spinner','Twister','Flip','Ziggy','Biscuit','Pepper','Duchess','Rocket','Nimbus','Bramble','Cartwheel','Wobbles','Maverick','Pip'];
function loadBest(){try{const o=JSON.parse(localStorage.getItem('rollerBest')),r={};if(o&&typeof o==='object')for(const k in o){const e=o[k];if(e&&typeof e.s==='number'&&typeof e.n==='string')r[k]=e}return r}catch(e){return{}}}
let best=loadBest();
function saveBest(){try{localStorage.setItem('rollerBest',JSON.stringify(best))}catch(e){}}

// Level bests screen: opens from the button or the B key, and the game pauses while it is open
let recOpen=false;
const recEl=document.getElementById('rec'),recBtn=document.getElementById('recbtn'),recList=document.getElementById('rl'),recX=document.getElementById('rx');
function renderRec(){
  let h='';
  for(let i=1;i<=MAX_LEVEL;i++){
    const b=best[i],bp=b&&window.pigeonPool.find(p=>p.name===b.n);
    h+=`<div class="rr${b?'':' none'}${i===level?' cur':''}"><span>Level ${i} ${THEMES[(i-1)%THEMES.length].n}</span><span>${b?`<i class="sw" style="background:${bp?bp.pat.b:'transparent'}"></i>${esc(b.n)} ${fmt(b.s)}`:'none yet'}</span></div>`;
  }
  recList.innerHTML=poolHtml()+h;
}
function toggleRec(){
  recOpen=!recOpen;recEl.hidden=!recOpen;
  if(recOpen){renderRec();recX.focus()}else recBtn.focus();
}
for(const el of[recBtn,recEl])['mousedown','touchstart','touchend'].forEach(t=>el.addEventListener(t,e=>e.stopPropagation()));
recBtn.addEventListener('click',toggleRec);recX.addEventListener('click',toggleRec);
recEl.addEventListener('click',e=>{if(e.target===recEl)toggleRec()});

// Hawk raids: land before it strikes or it carries off one bird until the level ends.
let hawk=null,hawkDone=false,roundT=0,taken=[],alertT=0,alertTxt='',alertCol='#fff';
const HBODY=new Path2D('M.7,-.35C.2,-.58,-.6,-.42,-1,-.1C-.6,.36,.2,.46,.75,.12C.92,-.05,.86,-.24,.7,-.35Z');
const HWING=new Path2D();HWING.moveTo(0,0);HWING.bezierCurveTo(-.4,-.5,-1.4,-.55,-2.1,-.05);
for(let i=1;i<=5;i++){const t=i/5,x=-2.1+1.95*t,y=-.05+.5*t;HWING.lineTo(x-.14,y+.12);HWING.lineTo(x,y)}
HWING.closePath();
// Raid schedule: two raids per level, never on landing 1; level 9 keeps landings 3 and 5
function raids(L){if(L===9)return[3,5];const a=2+(L*7+1)%5;return[a,a+2+(L*5+2)%(9-a)]}
function say(t,c,d){alertTxt=t;alertCol=c;alertT=d||170}
function hawkAvoid(){if(hawk&&hawk.state==='in'){say('Safe landing, the hawk gave up','#fff');snd('safe')}}

// Sound: all synthesised with Web Audio (no files). Every level gets its own palette (root note, scale, waveform) and every scene its own ambience.
const SCALES=[[0,2,4,7,9],[0,3,5,7,10],[0,2,3,7,8],[0,2,5,7,9]],WAVES=['sine','triangle','square','sawtooth'];
const AMB=[[500,.05,'sparrow'],[300,.04,'coo'],[700,.05,'song'],[900,.09,''],[250,.03,'cricket'],[1200,.08,'bell'],[600,.06,'rustle'],[350,.035,'song']]; // wind cutoff, wind level, chirp kind
let ac=null,mg=null,nbuf=null,windF=null,windG=null,pl=null,lastRoll=0,lastSq=0,sndOn=true;
try{sndOn=localStorage.getItem('rollerSnd')!=='0'}catch(e){}
const sndBtn=document.getElementById('sndbtn');
sndBtn.textContent=sndOn?'Sound on':'Sound off';sndBtn.setAttribute('aria-pressed',String(sndOn));
const hz=m=>440*Math.pow(2,(m-69)/12);
const nt=i=>hz(pl.r+12+pl.sc[i%5]+12*Math.floor(i/5));
function setPal(){
  if(pl&&pl.L===level)return;
  const L=level,k=(L>>1)%4;
  pl={L,r:48+(L*5+Math.floor(L/12)*2)%12,sc:SCALES[L%4],w:WAVES[k],v:k<2?1:.45};
  ambient();
}
function ambient(){
  if(!windF)return;
  const a=AMB[(level-1)%THEMES.length],t=ac.currentTime;
  windF.frequency.setTargetAtTime(a[0],t,.5);windG.gain.setTargetAtTime(a[1],t,.5);
}
function unlock(){
  if(!ac){
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    ac=new C();mg=ac.createGain();mg.gain.value=sndOn?.6:0;mg.connect(ac.destination);
    nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
    const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const w=ac.createBufferSource();w.buffer=nbuf;w.loop=true;
    windF=ac.createBiquadFilter();windF.type='lowpass';windG=ac.createGain();windG.gain.value=0;
    w.connect(windF);windF.connect(windG);windG.connect(mg);w.start();
    setPal();ambient();setInterval(chirp,1700);
  }
  if(ac.state==='suspended')ac.resume();
}
function tone(f,t0,d,type,vol,end){
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;
  o.type=type;o.frequency.setValueAtTime(f,t);if(end)o.frequency.exponentialRampToValueAtTime(end,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05);
}
function noise(t0,d,vol,fc,q){
  const n=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),t=ac.currentTime+t0;
  n.buffer=nbuf;f.type='bandpass';f.frequency.value=fc;f.Q.value=q;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  n.connect(f);f.connect(g);g.connect(mg);n.start(t);n.stop(t+d+.05);
}
const SFX={
  flap(){noise(0,.1,.16,900+pl.r*25,.8);tone(nt(0)*2,0,.07,'triangle',.04*pl.v)},
  roll(n){const t=ac.currentTime;if(t-lastRoll<.07)return;lastRoll=t;tone(nt(n+1),0,.14,pl.w,.07*pl.v)},
  sq(h){noise(0,.3,h>1?.25:.12,h>1?400:1100,1.5);if(h>1)tone(hz(pl.r-12),0,.2,'sine',.2,hz(pl.r-24))},
  land(p,rec){
    const n=3+Math.min(4,Math.floor(p/50));
    for(let i=0;i<n;i++)tone(nt(i*2),i*.07,.4,pl.w,.1*pl.v);
    tone(110,0,.12,'sine',.25,55);
    if(rec)for(let i=0;i<3;i++)tone(nt(8+i*2)*2,.35+i*.07,.5,'triangle',.07);
  },
  up(){for(let i=0;i<8;i++)tone(nt(i),.45+i*.09,.5,pl.w,.1*pl.v);for(const i of[0,2,4])tone(nt(i),1.2,1.2,'triangle',.08)},
  over(){tone(hz(pl.r+12),0,.7,'sawtooth',.12,hz(pl.r-12));noise(0,.25,.3,300,.7)},
  hawk(){tone(2600,0,.5,'sawtooth',.07,1500);tone(2000,.08,.4,'square',.03,1200)},
  catch(){noise(0,.18,.35,500,.7);tone(950,0,.3,'square',.1,280);noise(.15,.6,.12,1800,.9)},
  coin(){tone(1568,0,.12,'square',.05);tone(2093,.1,.35,'square',.05);tone(2637,.2,.4,'square',.04)},
  safe(){tone(nt(2),.4,.3,'triangle',.1);tone(nt(4),.52,.5,'triangle',.1)}
};
function snd(k,a,b){if(!ac||!sndOn||ac.state!=='running'||!pl)return;try{SFX[k](a,b)}catch(e){}}
function chirp(){
  if(!ac||!sndOn||ac.state!=='running'||document.hidden||Math.random()<.45)return;
  const k=AMB[(level-1)%THEMES.length][2],f=2800+Math.random()*1200;
  try{

class Pigeon{

  draw(){
    const P=this.pat,u=this.size*1.2,rl=this.rollTimer>0;
    this.perch+=((this.onLoft?.5:0)-this.perch)*.3;
    const th=rl?1.05+Math.sin(this.wingPhase*1.8)*.1:this.onLoft?.02:.25+Math.sin(this.wingPhase)*.95;
    ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.angle*this.face);ctx.scale(this.face*u,u);
    ctx.translate(0,-this.perch);ctx.rotate(-this.perch*.6);
    drawWing(P,th+.35,true);drawTail(P,rl?.3:.06);
    if(this.perch>.05){ // short clean red legs
      ctx.strokeStyle='#b8453a';ctx.lineWidth=.09;ctx.lineCap='round';ctx.beginPath();
      ctx.moveTo(-.12,.5);ctx.lineTo(-.1,1.02);ctx.moveTo(.2,.5);ctx.lineTo(.22,1.02);
      ctx.moveTo(-.1,1.02);ctx.lineTo(.12,1.04);ctx.moveTo(.22,1.02);ctx.lineTo(.44,1.04);ctx.stroke();
    }
    fs(BODY,P.b);shade(BODY);
    fs(NECK,P.h);
    if(P.sh){ // iridescent neck sheen
      ctx.save();ctx.clip(NECK);
      const g=ctx.createLinearGradient(.4,-.8,1,-.1);
      g.addColorStop(0,'rgba(60,200,150,'+.6*P.sh+')');g.addColorStop(1,'rgba(170,80,220,'+.55*P.sh+')');
      ctx.fillStyle=g;ctx.fillRect(0,-1.4,2,1.8);ctx.restore();
    }
    fs(HEAD,P.h);shade(HEAD);
    ctx.fillStyle=P.k;ctx.beginPath();ctx.moveTo(1.03,-.96);ctx.lineTo(1.42,-.84);ctx.lineTo(1.03,-.74);ctx.closePath();ctx.fill(); // short fine beak
    ctx.fillStyle='#f1ebe2';ctx.beginPath();ctx.arc(1.05,-.93,.075,0,TAU);ctx.fill(); // small cere
    ctx.fillStyle='#f8f1d2';ctx.strokeStyle='#7a2f2a';ctx.lineWidth=.045;ctx.beginPath();ctx.arc(.87,-.93,.125,0,TAU);ctx.fill();ctx.stroke(); // pearl eye
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(.895,-.93,.058,0,TAU);ctx.fill();
    drawWing(P,th,false);
    if(rl){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=.07;ctx.lineCap='round';
      for(const a of[-1.1,2]){ctx.beginPath();ctx.arc(0,0,1.6,a,a+1.3);ctx.stroke()}}
    ctx.restore();
  }
}

if(!window.pigeonPool){window.pigeonPool=[];for(let i=0;i<TOTAL_POOL;i++)window.pigeonPool.push({pat:PATS[i%PATS.length],id:i,name:NAMES[i],instance:null})}

function initLevel(){
  const ti=(level-1)%THEMES.length;if(ti!==themeIdx){themeIdx=ti;buildScene()}
  pigeons.length=0;flyingIndices=[];
  setPal();hawk=null;hawkDone=false;roundT=0;
  const temp=window.pigeonPool.filter(p=>!taken.includes(p.id));
  for(let i=0;i<BASE_FLOCK;i++){
    const it=temp.splice(Math.floor(Math.random()*temp.length),1)[0];
    flyingIndices.push(it.id);
    let p=it.instance;if(!p){p=new Pigeon(it.pat);p.name=it.name;p.id=it.id;it.instance=p}
    p.resetInLoft(i);pigeons.push(p);
  }
  gameOver=false;gameStarted=false;updateHUD();
}
function flapAll(){if(gameStarted&&!gameOver){pigeons.forEach(p=>p.flap());snd('flap')}}
function startGame(){if(!gameStarted){gameStarted=true;placeBet();pigeons.forEach(p=>p.flap())}}
function restartIfOver(){if(gameOver&&!entering){level=startLevel;score=0;landings=0;toast=null;taken=[];levelLandings=0;banner=150;lastIdx=-1;initLevel();gameStarted=true;placeBet()}}

window.addEventListener('keydown',e=>{
  if(entering)return;
  if(e.code==='KeyV'&&!e.ctrlKey&&!e.metaKey){toggleMic();return}
  if(e.code==='KeyC'&&!e.ctrlKey&&!e.metaKey){callKey=true;return}
  if(e.code==='KeyF'&&!e.ctrlKey&&!e.metaKey){toggleFull();return}
  if(e.code==='KeyM'){toggleSnd();return}
  if((e.code==='KeyB'&&!e.ctrlKey&&!e.metaKey)||(recOpen&&e.code==='Escape')){toggleRec();return}
  if(recOpen)return;
  if(e.code==='ArrowUp'){squeezing=true;hardSqueeze=e.shiftKey;e.preventDefault()}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();startGame();flapAll();restartIfOver()}
});
window.addEventListener('keyup',e=>{if(e.code==='ArrowUp'){squeezing=false;hardSqueeze=false}if(e.code==='KeyC')callKey=false});
window.addEventListener('mousedown',()=>{if(entering)return;startGame();flapAll();restartIfOver()});
window.addEventListener('touchstart',e=>{
  if(entering)return;e.preventDefault();activeTouches=e.touches.length;
  if(activeTouches===1){touchStartY=e.touches[0].clientY;hardSqueeze=false}
  if(activeTouches>=2){hardSqueeze=true;squeezing=true}
  startGame();restartIfOver();
},{passive:false});
window.addEventListener('touchmove',e=>{
  if(touchStartY==null)return;
  squeezing=(touchStartY-e.touches[0].clientY)>40;activeTouches=e.touches.length;
  if(activeTouches>=2){hardSqueeze=true;squeezing=true}
},{passive:false});
window.addEventListener('touchend',e=>{
  if(!squeezing&&!hardSqueeze&&!gameOver)flapAll();
  squeezing=false;hardSqueeze=false;touchStartY=null;activeTouches=e.touches?e.touches.length:0;
},{passive:false});

// Scenery: sky, hills, Birmingham terraces, garden fence and the loft are painted once and reused
function buildScene(){
  scene.width=W*dpr;scene.height=H*dpr;
  const c=scene.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);const T=THEMES[themeIdx];
  let g=c.createLinearGradient(0,0,0,H);T.sky.forEach((k,i)=>g.addColorStop([0,.62,1][i],k));
  c.fillStyle=g;c.fillRect(0,0,W,H);
  g=c.createRadialGradient(W*T.sun[0],H*T.sun[1],0,W*T.sun[0],H*T.sun[1],H*.55);g.addColorStop(0,'rgba('+T.sun[2]+',.8)');g.addColorStop(1,'rgba('+T.sun[2]+',0)');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  const gy=H-34;
  if(T.night){c.fillStyle='#fff';for(let i=0;i<70;i++){c.globalAlpha=.35+Math.random()*.65;c.fillRect(Math.random()*W,Math.random()*H*.65,1.6,1.6)}c.globalAlpha=1;c.fillStyle='#f4f7ff';c.beginPath();c.arc(W*T.sun[0],H*T.sun[1],17,0,TAU);c.fill()}
  c.fillStyle=T.hill;c.beginPath();c.moveTo(0,gy);
  for(let x=0;x<=W;x+=20)c.lineTo(x,gy-135-Math.sin(x/90)*28-Math.sin(x/37)*9);
  c.lineTo(W,gy);c.fill();
  let s=7;const r=()=>(s=s*16807%2147483647)/2147483647;
  for(let x=-8;x<W;){
    if(T.kind){const rr=16+r()*20,ty=gy-6-r()*22;c.fillStyle='#4b3a2a';c.fillRect(x+rr*.9,ty,5,gy-ty);c.fillStyle=T.tree[Math.floor(r()*3)];c.beginPath();c.arc(x+rr,ty-rr*.5,rr,0,TAU);c.moveTo(x+rr*2.4,ty-rr*.2);c.arc(x+rr*1.7,ty-rr*.2,rr*.7,0,TAU);c.fill();x+=rr*1.6;continue}
    const w=46+r()*20,h=64+r()*38,y=gy-h,cx=x+w*.68;
    c.fillStyle=T.brick[r()>.5?0:1];c.fillRect(x,y,w,h);
    c.fillStyle='rgba(0,0,0,.12)';c.fillRect(x+w-2,y,2,h);
    c.fillStyle=T.roof;c.beginPath();c.moveTo(x-3,y+1);c.lineTo(x+w/2,y-w*.3);c.lineTo(x+w+3,y+1);c.fill();if(T.snow){c.strokeStyle='#fff';c.lineWidth=4;c.stroke()}
    c.fillStyle='#86402d';c.fillRect(cx,y-w*.36,8,w*.26);
    c.fillStyle='#c9794a';c.fillRect(cx-1,y-w*.36-3,10,3);c.fillRect(cx+1,y-w*.36-9,2.5,6);c.fillRect(cx+5,y-w*.36-9,2.5,6);
    c.fillStyle=T.win;c.fillRect(x+8,y+12,10,15);c.fillRect(x+w-18,y+12,10,15);
    if(h>84)c.fillRect(x+8,y+h-48,10,15);
    c.fillStyle='#34261f';c.fillRect(x+w-20,gy-26,12,26);
    x+=w;
  }
  g=c.createLinearGradient(0,gy-150,0,gy);g.addColorStop(0,'rgba('+T.hz+',0)');g.addColorStop(1,'rgba('+T.hz+',.42)');
  c.fillStyle=g;c.fillRect(0,gy-150,W,150);
  g=c.createLinearGradient(0,gy,0,H);g.addColorStop(0,T.grass[0]);g.addColorStop(1,T.grass[1]);
  c.fillStyle=g;c.fillRect(0,gy,W,H-gy);
  c.fillStyle=T.fence;for(let x=0;x<W;x+=9)c.fillRect(x,gy-13,5,13);c.fillRect(0,gy-9,W,2);
  const lx=loft.x,ly=loft.y;
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(lx+50,H-8,62,6,0,0,TAU);c.fill();
  c.fillStyle='#9a6a3a';c.fillRect(lx,ly,100,60);
  c.strokeStyle='rgba(60,35,15,.35)';c.lineWidth=1;c.beginPath();
  for(let i=10;i<100;i+=10){c.moveTo(lx+i,ly+7);c.lineTo(lx+i,ly+60)}c.stroke();
  c.fillStyle='#7a4f27';c.fillRect(lx,ly+7,100,2);
  c.fillStyle='#c9a06a';c.fillRect(lx,ly,100,7);c.fillStyle='#e6c38e';c.fillRect(lx,ly,100,2); // landing ledge
  const arch=new Path2D();arch.moveTo(lx+30,ly+58);arch.lineTo(lx+30,ly+44);arch.arc(lx+50,ly+44,20,Math.PI,0);arch.lineTo(lx+70,ly+58);arch.closePath();
  c.fillStyle='#2b1d12';c.fill(arch);
  c.save();c.clip(arch);c.strokeStyle='#d8c8a4';c.lineWidth=1.2;c.beginPath();
  for(let i=36;i<70;i+=5){c.moveTo(lx+i,ly+20);c.lineTo(lx+i,ly+58)}c.stroke();c.restore(); // bob-wires
  c.strokeStyle='#c9a06a';c.lineWidth=3;c.stroke(arch);
  c.fillStyle='#fff';c.font='700 10px Georgia,serif';c.textAlign='center';c.fillText('Kit Box Loft',lx+50,ly+19);
}
function drawCloud(k){
  const x=k.x,y=k.y,s=k.s;ctx.beginPath();
  for(const[a,b,rx,ry]of[[0,0,38,13],[22,-9,26,14],[-22,-4,22,11],[4,-12,24,13]]){ctx.moveTo(x+(a+rx)*s,y+b*s);ctx.ellipse(x+a*s,y+b*s,rx*s,ry*s,0,0,TAU)}
  ctx.fill();
}
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  const rc=canvas.getBoundingClientRect();W=rc.width;H=rc.height;
  canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const ox=loft.x,oy=loft.y;loft.x=Math.round(W/2-loft.w/2);loft.y=Math.round(H-loft.h-10);
  if(gameStarted)pigeons.forEach(p=>{p.x+=loft.x-ox;p.y+=loft.y-oy}); // keep a flight in progress lined up with the loft when the screen size changes
  buildScene();
  clouds=[0,1,2,3,4].map(i=>({x:(i+.3)*W/4.2,y:H*(.07+.06*((i*3)%5)),s:.7+.2*((i*7)%4),v:.12+.06*(i%3)}));
  if(!gameStarted)pigeons.forEach((p,i)=>p.resetInLoft(i));
}
window.addEventListener('resize',resize);
resize();

function drawSqueezeIndicator(){
  if(!squeezing&&!hardSqueeze)return;
  ctx.save();ctx.fillStyle=hardSqueeze?'rgba(200,30,30,.22)':'rgba(0,140,255,.14)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.arc(W/2,H*.45,40,0,TAU);ctx.fill();ctx.restore();
}
function updateHUD(){
  const top=scores[0],hs=Math.max(top?top.s:0,landings>=HS_MIN?score:0),lb=best[level],idle=!gameStarted;
  const prev=Math.min(bank,mult*10),k=prev/(mult*10),pv=p=>idle?Math.round(refPot(p.id)*k*100)/100:(p.pot||0),flockTot=pigeons.reduce((s,p)=>s+pv(p),0),allTot=window.pigeonPool.reduce((s,q)=>s+refPot(q.id)*k,0);
  const pots=pigeons.map(p=>`<i>${p.name} ${fmt(pv(p))}</i>`).join('');
  const sc=`<span class='k'>Level ${level} ${THEMES[themeIdx].n}</span>`;
  const s=idle?`<div class='sh'><b>Betting slip</b>${sc}</div>
<div class='r'><span>Savings</span><b class='g'>${fmt(bank)}</b></div>
<div class='r'><span>Your bet</span><span class='bet'><button data-b='-1' aria-label='Lower the bet'${mult<=2?' disabled':''}>&minus;</button><b>${mult}x</b><button data-b='1' aria-label='Raise the bet'${mult>=10?' disabled':''}>+</button></span><b class='g'>${fmt(prev)}</b></div>
<div class='pots'>${pots}</div>
<div class='r'><span>Flying next landing</span><b class='g'>${fmt(flockTot)}</b></div>
<div class='r'><span>Pool, all 15 pigeons</span><b>${fmt(allTot)}</b></div>
<div class='r'><span>Run winnings</span><b>${fmt(score)}</b></div>
<div class='r'><span>Best run</span><b>${hs?fmt(hs,0):'none yet'}${top&&top.s>=score?' '+esc(top.n):''}</b></div>
<div class='r'><span>Level ${level} best bird</span><b>${lb?esc(lb.n)+' '+fmt(lb.s):'none yet'}</b></div>
<div class='rules'>Tap or Space to flap. Swipe up or ↑ to tighten the kit, two fingers or Shift+↑ to snap it. Your bet buys one pot per pigeon, bigger for pigeons with more spins, and every spin in flight adds to that pigeon's pot. The landing pays the flock's pots at odds set by rolls, height and time. A hawk takes a pigeon and its pot. Call the flock back to the loft with a steady whistle or a sung ooo (Voice call button, or hold the Call button or C).</div>`
  :`<div class='sh'><b>${fmt(bank)}</b>${sc}</div>
<div class='r'><span>Bet ${mult}x ${fmt(stake)}, run ${fmt(score)}</span><b class='g'>Pot ${fmt(flockTot)}</b></div>
<div class='pots'>${pots}</div>`;
  if(s!==lastHud){hud.innerHTML=s;lastHud=s}
}
function updateHUDLegacy(){
  let dots='';const top=scores[0],hs=Math.max(top?top.s:0,landings>=HS_MIN?score:0),lb=best[level];
  for(const p of window.pigeonPool)dots+=`<div class="pool-dot" title="${p.pat.n}" style="background:${taken.includes(p.id)?'#2a2a2a':flyingIndices.includes(p.id)?'#8cc8f0':p.pat.b}"></div>`;
  const s=`<div><b>Level</b> ${level} (${THEMES[themeIdx].n}) &nbsp; <b>Landings</b> ${landings} &nbsp; <b>Score</b> ${score} &nbsp; <b>High Score</b> ${hs}${top&&top.s>=score?' ('+esc(top.n)+')':''}</div>
<div style="margin-top:3px;font-size:12px"><b>Flock</b> ${pigeons.map(p=>p.name).join(', ')}</div>
<div style="font-size:12px"><b>Level ${level} best</b> ${lb?esc(lb.n)+' '+lb.s:'none yet'}</div>
<div style="margin-top:4px;font-size:12px">Tap or Space to flap. Swipe up or ↑ to tighten. Two fingers or Shift+↑ to snap the kit.</div>
<div style="margin-top:5px;font-size:11px;opacity:.85">15 Birmingham Rollers (sky blue = flying, dark = taken by a hawk)</div><div class="pool-wrap">${dots}</div>`;
  if(s!==lastHud){hud.innerHTML=s;lastHud=s}
}
function loop(){
  ctx.drawImage(scene,0,0,W,H);
  ctx.fillStyle=THEMES[themeIdx].cl;
  for(const k of clouds){if(!calm){k.x+=k.v;if(k.x>W+90)k.x=-90}drawCloud(k)}
  drawSqueezeIndicator();
  {const sq=hardSqueeze?2:squeezing?1:0;if(sq>lastSq&&gameStarted&&!gameOver)snd('sq',sq);lastSq=sq}
  let cx=loft.x+loft.w/2,cy=loft.y-50;
  if(pigeons.length){cx=pigeons.reduce((s,p)=>s+p.x,0)/pigeons.length;cy=pigeons.reduce((s,p)=>s+p.y,0)/pigeons.length}
  micTick();if(callP>0&&gameStarted&&!gameOver&&!recOpen)callPull();
  if(gameStarted&&!recOpen)pigeons.forEach(p=>p.update(cx,cy,squeezing,hardSqueeze));
  if(gameStarted&&!recOpen&&!gameOver){roundT++;hawkTick()}
  pigeons.forEach(p=>p.draw());if(hawk)drawHawk();if(callP>0)drawCall();
  updateHUD();
  ctx.textAlign='center';
  hud.style.visibility=gameOver?'hidden':'visible';
  if(alertT>0&&!gameOver){alertT--;ctx.globalAlpha=Math.min(1,alertT/30);ctx.fillStyle=alertCol;ctx.font='700 '+Math.min(26,W/Math.max(15,Math.max(...alertTxt.split('|').map(l=>l.length))*.62))+'px Georgia,serif';ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=8;alertTxt.split('|').forEach((l,i)=>ctx.fillText(l,W/2,H*.3+i*Math.min(30,W/13)));ctx.shadowBlur=0;ctx.shadowColor='transparent';ctx.globalAlpha=1}
  if(banner>0&&!gameOver){banner--;ctx.globalAlpha=Math.min(1,banner/40);ctx.fillStyle='#fff';ctx.font='700 '+Math.min(30,W/18)+'px Georgia,serif';ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=8;ctx.fillText('Level '+level+': '+THEMES[themeIdx].n,W/2,H*.3);ctx.shadowBlur=0;ctx.shadowColor='transparent';ctx.globalAlpha=1}
  if(toast&&toast.t>0&&!gameOver){toast.t--;ctx.globalAlpha=Math.min(1,toast.t/40);ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=8;ctx.font='700 '+Math.min(34,W/12)+'px Georgia,serif';ctx.fillStyle=toast.total>=toast.stake?'#ffd35a':'#fff';ctx.fillText(toast.name+'  +'+fmt(toast.total),W/2,H*.5);ctx.fillStyle='#fff';ctx.font='600 '+Math.min(16,W/26)+'px Georgia,serif';ctx.fillText(toast.rolls+(toast.rolls===1?' roll, ':' rolls, ')+'height '+toast.h+'%, '+toast.sec+' s in the air',W/2,H*.5+26);{const net=toast.total-toast.stake;ctx.fillStyle=net>=0?'#9be58f':'#ff9b8f';ctx.fillText('Bet '+fmt(toast.stake)+', pots '+fmt(toast.pot)+' x '+toast.odds.toFixed(2)+', net '+(net>=0?'+':'-')+fmt(Math.abs(net)),W/2,H*.5+48)}if(toast.rec){ctx.fillStyle='#ffd35a';ctx.fillText('New best bird on level '+toast.lvl+'!',W/2,H*.5+70)}ctx.shadowBlur=0;ctx.shadowColor='transparent';ctx.globalAlpha=1}
  if(!gameStarted&&!gameOver){
    ctx.fillStyle='#fff';ctx.font='600 19px Georgia,serif';ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=6;
    ctx.fillText('Tap or press Space to release the kit',W/2,H*.4);ctx.shadowBlur=0;ctx.shadowColor='transparent';
  }
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='700 36px Georgia,serif';ctx.fillText('Game over',W/2,H*.2);
    ctx.font='18px Georgia,serif';ctx.fillText('Won '+fmt(score)+'   Savings '+fmt(bank),W/2,H*.2+30);
    if(!entering&&landings>=HS_MIN&&scores.length){
      const y0=H*.2+92,rh=Math.max(10,Math.min(22,(H*.8-132)/10));
      ctx.font='600 17px Georgia,serif';ctx.fillText('High scores',W/2,H*.2+64);
      ctx.font=Math.min(15,rh*.85)+'px Georgia,serif';
      scores.forEach((e,i)=>{ctx.fillStyle=i===lastIdx?'#ffd35a':'#fff';ctx.textAlign='left';ctx.fillText((i+1)+'. '+e.n,W/2-130,y0+i*rh);ctx.textAlign='right';ctx.fillText(fmt(e.s,0)+' (level '+e.l+')',W/2+130,y0+i*rh)});
      ctx.textAlign='center';
    }
    if(!entering){ctx.font='16px system-ui,sans-serif';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('Tap or click to restart',W/2,H-24)}
  }
  requestAnimationFrame(loop);
}
initLevel();
loop();
{const m=/[?#&]level=(\d+)/.exec(location.search+location.hash);if(m)jumpTo(+m[1])}
if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
